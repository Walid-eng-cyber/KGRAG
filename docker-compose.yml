# Local Neo4j for the knowledge graph.
#   Start:  docker compose up -d
#   Browser UI: http://localhost:7474  (user: neo4j / pass: kgrag-password)
#   Bolt (used by the app): bolt://localhost:7687
services:
  neo4j:
    image: neo4j:5.24
    container_name: kgrag-neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt driver
    environment:
      - NEO4J_AUTH=neo4j/kgrag-password
      - NEO4J_PLUGINS=["apoc"]          # APOC procedures (used by LlamaIndex)
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  # Postgres + pgvector: the vector index (Phase 2), alongside the graph.
  #   Host port 5434 (5432/5433 are taken by other local projects).
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kgrag-postgres
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=kgrag-password
      - POSTGRES_DB=kgrag
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  neo4j_data:
  neo4j_logs:
  pg_data:
